# Production-only hardening profile. Activated via spring.profiles.active=prod (or PROMPT_VAULT_PROFILES=prod).
#
# API docs: Swagger UI and /v3/api-docs stay open in dev because the local SPA workflow
# (Vite proxy + contract-driven client generation) depends on them; they are closed here.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  servlet:
    session:
      cookie:
        # Requires HTTPS in production; browsers reject Secure cookies over plain HTTP,
        # so this stays out of the default (plain-HTTP dev) profile.
        secure: true

prompt-vault:
  security:
    # Swagger UI is disabled in this profile, so its asset constraints do not apply here.
    csp-directives: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'